  <h1 id="leserstimmen" class="heading text-center mb-3 mb-md-5">Leserstimmen</h1>

  <figure class="my-5">
    <blockquote class="blockquote mb-2">
      <h3>Überwältigende Einsichten in die Gedanken eines Genies</h3>
      <p>Wahnsinnig gut geschriebenes Buch. Ich habe die englische Version schon verschlungen und die deutsche steht dieser in nichts nach.</p>
      <p>Wer unerwartete Konzepte und Ideen, aufbauend auf bekannten physikalischen und mathematischen Konzepten, kennenlernen möchte, der sollte dieses Buch unbedingt lesen. Absolute Empfehlung!</p>
    </blockquote>
    <figcaption class="blockquote-footer">
      <a target="_blank" href="https://www.amazon.de/gp/customer-reviews/R3SE349RPILUYD/">Kevin Henrichs</a>
    </figcaption>
  </figure>

  <figure class="my-5">

      <h3>Das Buch, das mein Weltbild transformiert hat</h3>
      <p>Das Buch hat mein Weltbild komplett transformiert.</p>
      <p>Wenn du einen Grund suchst, Hoffnung für die Menschheit zu haben: hier bekommst du hunderte gute Argumente</p>
    </blockquote>
    <figcaption class="blockquote-footer">

    </figcaption>

  <figure class="my-5">
    <blockquote class="blockquote mb-2">
      <h3>Verändert das Denken</h3>
      <p>Ich liebte das Buch auf Englisch schon. Dank an Herrn Deutsch!</p>
    </blockquote>
    <figcaption class="blockquote-footer">
      <a target="_blank" href="https://www.amazon.de/gp/customer-reviews/R1FTAZY4UWL3TI/">Amazon-Kunde</a>

  <figure class="my-5">
    <blockquote class="blockquote mb-2">
      <h3>[J]eder sollte es lesen!</h3>
      <p>Ich habe zuerst die englische Version gelesen und bin mit der deutschen Übersetzung sehr zufrieden. Wer sich für die Physik interessiert muss es (finde ich) lesen oder wer generell die Welt verstehen will der wird wohl auf kaum ein besseres Buch stoßen können als dieses. Es lohnt sich, es langsam zu lesen (oder es mehrmals zu lesen), was schon ein Indikator für seine Brillianz ist.<br>
      Es ist einfach unglaublich toll.</p>
    </blockquote>
    <figcaption class="blockquote-footer">
      <a target="_blank" href="https://www.amazon.de/gp/customer-reviews/R2AQG0E1SD1GP6/">Lara Marie</a>
    </figcaption>
  </figure>

  <figure class="my-5">
    <blockquote class="blockquote mb-2">
      <h3>Weitreichende Beitrage zu: Epistemology, Science of Science, und Progress Studies</h3>
      <p>Ich habe in meinem Leben etwa 440 Bücher (hauptsächlich Sachbücher) gelesen und 'Der Anfang der Unendlichkeit' ist mein absolutes Lieblingsbuch.</p>
      <p>Als Erstes habe ich die englische Version gelesen und nun auch die Deutsche begonnen. Die Übersetzung ist exzellent. An einigen Stellen verleiht der Übersetzer der deutschen Version durch eine reflektierte Wortwahl sogar eine neue Tiefe und Klarheit.</p>
      <p>Für jeden, der sich für die Themen Epistemologie, die Erschaffung neuen Wissens, die Wissenschaft der Wissenschaft (Science of Science), oder die Wissenschaft vom ökonomischen und wissenschaftlichen Fortschritt (Progress Studies) interessiert, ist dieses Buch ein absolutes Muss.</p>
    </blockquote>
    <figcaption class="blockquote-footer">
      <a target="_blank" href="https://www.amazon.de/gp/customer-reviews/R1ER4DSXN0RMKS/">Moritz W.</a>
    </figcaption>
  </figure>

  <figure class="my-5">
    <blockquote class="blockquote mb-2">
      <h3>Der Anfang ist kompliziert, unerklärbar komplex im endlichen ... oder wie war das noch?</h3>
      <p>[…]</p>
      <p>Unglaublich umwerfend […]</p>
      <p>[…]</p>
      <p>Der Autor und Übersetzter haben auf jeden Fall - selbst ohne mein Fachwissen kann ich das behaupten - großartige Arbeit geleistet, mit diesem Werk in Buchformat.</p>
    </blockquote>
